name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ----------------------------------------------------------------
  # Job 1: Run the full Python test suite (schema + backend + engine)
  # ----------------------------------------------------------------
  #
  # Historically this job only ran tests/test_schema_validation.py, which
  # meant the backend route tests (tests/backend/) and engine agent/
  # dispatch tests (tests/engine/) — ~100 tests — were never exercised
  # by CI despite passing locally. That gap is closed here.
  #
  # SENTINEL_SKIP_ENV_CHECK=1 tells backend.config.Settings.load() to
  # skip the infrastructure/.env presence check (there is no .env in
  # CI — secrets are injected directly via env vars when needed). The
  # backend tests don't need any real secrets because the app fixture
  # in tests/backend/conftest.py patches the engine + dispatcher with
  # in-memory fakes.
  python-tests:
    name: Validate Schemas
    runs-on: ubuntu-latest
    env:
      SENTINEL_SKIP_ENV_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r backend/requirements.txt
          pip install -r engine/requirements.txt
          pip install -r mcp-servers/fs-manager/requirements.txt
          pip install -r mcp-servers/git-sync/requirements.txt

      - name: Run the full Python test suite
        run: pytest tests/ -v

  # ----------------------------------------------------------------
  # Job 2: Lint and format-check every Python package in the repo
  # ----------------------------------------------------------------
  # Scope originally was mcp-servers/ only; expanded to engine/,
  # backend/, tests/, and scripts/ so style drift in Python code
  # outside the MCP servers stops being invisible to CI. See
  # docs/TESTING.md "What runs in CI" for the current list.
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check for lint errors
        run: ruff check engine/ backend/ tests/ scripts/ mcp-servers/

      - name: Check formatting
        run: ruff format --check engine/ backend/ tests/ scripts/ mcp-servers/

  # ----------------------------------------------------------------
  # Job 3: TypeScript type-check all libs and artifacts
  # ----------------------------------------------------------------
  typecheck-typescript:
    name: Typecheck TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checks
        run: pnpm run typecheck

  # ----------------------------------------------------------------
  # Job 4: Frontend tests (vitest + @testing-library/react)
  # ----------------------------------------------------------------
  # Runs the apps/sentinel-ui test suite. Vitest piggybacks on the
  # existing vite.config.js — see apps/sentinel-ui/vite.config.js
  # for the test-specific config block. Test files live alongside
  # the source as src/**/*.{test,spec}.{js,jsx}.
  #
  # This job is separate from "Typecheck TypeScript" so PR check
  # listings show frontend tests as their own line item.
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @sentinel/ui run test
