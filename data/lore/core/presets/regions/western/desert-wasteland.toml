- The Shorn Ridge gang, a small outfit that works the
  wagon road between the last town and the empty middle.
  They are not the worst thing on the Flats.
- Salvation, the town that only half the maps agree
  exists — a dozen buildings around a working well in
  the blank part of the map. The people who live there
  do not particularly want to be found, but they will not
  turn away a traveller who reaches their door in good
  faith.

Open the player at the last watering hole before the Flats,
preparing for a crossing they already know is a bad idea.
